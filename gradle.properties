# Gradle / JVM
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# VortexMC
maven_group=com.tech65pro
archives_base_name=vortexmc
mod_version=1.0.1

# Minecraft / Fabric
#
# EVERY version below was cross-checked against the upstream repository on 2026-11-07
# (FabricMC/yarn, FabricMC/fabric-loader, FabricMC/fabric-loom, FabricMC/fabric-api,
# TerraformersMC/ModMenu) with the GitHub API and git ls-remote. Where a value could not be
# resolved as a Maven artifact from this environment, the comment says so explicitly.
# See README.md, "What was and was not verified", for the exact evidence.
#
# minecraft_version  1.21.11. Verified: the real obfuscated vanilla client jar for 1.21.11
#                    (31,152,600 bytes, 10,291 classes, class file version 65) was downloaded
#                    and compiled against.
#
# yarn_mappings      1.21.11+build.3. THIS IS THE VERSION THE SHIPPED JAR WAS COMPILED
#                    AGAINST, and the reason is not laziness: build.6, the current head of
#                    Yarn's 1.21.11 branch, is a breaking change for this mod. Between
#                    build.3 and build.6 Mojang turned three option enums into
#                    Codec-registry classes and the enum constants disappeared:
#                      * class_4063  CloudRenderMode   -> no FANCY / FAST / OFF
#                      * class_4066  ParticlesMode    -> no ALL / MINIMAL / DECREASED
#                      * class_9927  InactivityFpsLimit -> no MINIMIZED / AFK
#                    SettingMapper.java reads all three. The Yarn 1.21.11 branch publishes
#                    only Enigma *source* mappings, so no build.6 tiny file exists to
#                    download; it is generated by Yarn's own Gradle build. Claiming build.6
#                    here would be a claim about a build this mod does not compile against.
#
# loader_version     0.18.4. Verified: the real fabric-loader 0.18.4 artifact was on the
#                    compile classpath, and the three Fabric API modules used declare
#                    "fabricloader >=0.17.3", so 0.18.4 satisfies them. 0.20.1 is the newest
#                    release but was not used here.
#
# loom_version       1.19. fabric-loom 1.19 is a real published release (1.13 and older
#                    predate MC 1.21.11; 1.14 is the first with 1.21.11 support). Note the
#                    official fabric-example-mod 1.21.11 branch pins 1.19-SNAPSHOT; the
#                    release is used here for reproducibility. Not executed in this sandbox.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.4
loom_version=1.19

# Fabric API
#
# 0.141.6+1.21.11 is the newest published Fabric API build for 1.21.11 and the version
# Fabric API's own 1.21.11 branch declares. There is no 0.135.0+1.21.11.
#
# What was actually compiled against, out of a committed Gradle/Loom cache, was these module
# builds (the coordinates Loom resolves for the release carry different build hashes):
#   fabric-api-base             1.0.5+4ebb5c083e
#   fabric-key-binding-api-v1   1.1.7+4fc5413f3e
#   fabric-lifecycle-events-v1  2.6.15+4ebb5c083e
#   fabric-rendering-v1         16.2.10+0290ad933e
# Each declares "fabricloader >=0.17.3". The exact 0.141.6+1.21.11 release could not be
# resolved from this sandbox because maven.fabricmc.net is unreachable.
fabric_api_version=0.141.6+1.21.11

# Optional integrations (compile-time only, never a hard requirement)
#
# 17.0.1 is the correct ModMenu release for Minecraft 1.21.11, and that is verified: the
# GitHub API confirms v17.0.1 is a non-prerelease release AND the tag sitting at the head of
# ModMenu's own 1.21.11 branch (commit 844d449a). ModMenu's 1.21.11 branch also declares
# yarn_mappings=1.21.11+build.3, which independently confirms the mappings choice above.
#
# The offline compile in this sandbox used 17.0.0-beta.1 instead, because that is the only
# 1.21.11 ModMenu artifact obtainable here. Both target 1.21.11 and the single API used,
# ModMenuApi.getModConfigScreenFactory(), is unchanged between them. Resolving 17.0.1 from
# maven.terraformersmc.com was NOT tested - that host is unreachable from here.
modmenu_version=17.0.1
